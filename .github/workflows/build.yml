name: Build

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '*.adoc'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.adoc'
      - '*.md'
  workflow_dispatch:
    inputs:
      lint-gradle-tasks:
        description: 'Gradle tasks to run for lint and static analysis'
        required: false
        default: ''
        type: string
      test-gradle-tasks:
        description: 'Gradle tasks to run for unit and default test coverage'
        required: false
        default: '--parallel test'
        type: string
      integration-gradle-tasks:
        description: 'Gradle tasks to run for slower integration coverage'
        required: false
        default: '--parallel integrationTest'
        type: string
      package-gradle-tasks:
        description: 'Gradle tasks to run for packaging and assembly verification'
        required: false
        default: '--parallel assemble'
        type: string

permissions:
  contents: read
  checks: write
  pull-requests: write
  id-token: write

jobs:
  build:
    name: Java ${{ matrix.test-java }}
    strategy:
      fail-fast: false
      matrix:
        test-java: ['21', '25', '27']
    uses: redis/github-workflows/.github/workflows/build.yml@main
    with:
      split-jobs: true
      java-version: |
        ${{ matrix.test-java }}
        27
      lint-gradle-tasks: ${{ matrix.test-java == '27' && inputs.lint-gradle-tasks || '' }}
      test-gradle-tasks: ${{ format('{0} -PtestJavaVersion={1}', inputs.test-gradle-tasks || '--parallel test', matrix.test-java) }}
      integration-gradle-tasks: ${{ format('{0} -PtestJavaVersion={1}', inputs.integration-gradle-tasks || '--parallel integrationTest', matrix.test-java) }}
      package-gradle-tasks: ${{ matrix.test-java == '27' && (inputs.package-gradle-tasks || '--parallel assemble') || '' }}

  worker:
    name: Confluent 8.3 / Java 21
    uses: redis/github-workflows/.github/workflows/build.yml@main
    with:
      split-jobs: true
      java-version: |
        21
        27
      lint-gradle-tasks: ''
      test-gradle-tasks: ''
      integration-gradle-tasks: 'workerTest -PtestJavaVersion=21'
      package-gradle-tasks: ''
