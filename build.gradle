import org.gradle.api.plugins.jvm.JvmTestSuite
import org.gradle.process.CommandLineArgumentProvider

plugins {
    id 'java-library'
    alias(libs.plugins.axion.release)
    alias(libs.plugins.ben.manes.versions)
    alias(libs.plugins.shadow) apply false
}

group = 'com.redis'

scmVersion {
    tag {
        prefix = 'v'
        versionSeparator = ''
    }
}

version = scmVersion.version

def testJavaVersion = providers.gradleProperty('testJavaVersion').map { Integer.parseInt(it) }.orElse(27)

subprojects {
    apply plugin: 'java-library'

    group = rootProject.group
    version = rootProject.version

    def mockitoAgent = configurations.create('mockitoAgent') {
        transitive = false
    }

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(27)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 17
    }

    tasks.register('sourcesJar', Jar) {
        archiveClassifier.set('sources')
        from sourceSets.main.allSource
    }

    tasks.register('javadocJar', Jar) {
        dependsOn javadoc
        archiveClassifier.set('javadoc')
        from javadoc.destinationDir
    }

    build {
        dependsOn sourcesJar, javadocJar
    }

    testing {
        suites {
            test {
                useJUnitJupiter(rootProject.libs.versions.junit.get())
            }

            integrationTest(JvmTestSuite) {
                useJUnitJupiter(rootProject.libs.versions.junit.get())

                dependencies {
                    implementation project()
                    implementation 'org.junit.jupiter:junit-jupiter'
                    implementation rootProject.libs.assertj
                    runtimeOnly 'org.junit.platform:junit-platform-launcher'
                }

                targets {
                    all {
                        testTask.configure {
                            shouldRunAfter(test)
                        }
                    }
                }
            }
        }
    }

    tasks.withType(Test).configureEach {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(testJavaVersion.get())
        }
        timeout = Duration.ofMinutes(15)
        jvmArgumentProviders.add({
            ["-javaagent:${mockitoAgent.asPath}"]
        } as CommandLineArgumentProvider)
        useJUnitPlatform()
        testLogging {
            events 'passed', 'skipped', 'failed'
            exceptionFormat = 'full'
        }
        systemProperty 'io.lettuce.core.epoll', 'false'
        systemProperty 'io.lettuce.core.kqueue', 'false'
        systemProperty 'io.lettuce.core.iouring', 'false'
        systemProperty 'redis.enterprise.image', providers.gradleProperty('redisEnterpriseImage')
                .orElse('redislabs/redis:8.2.0-125.19').get()
        systemProperty 'redis.image', providers.gradleProperty('redisImage').orElse('redis:8.2.10').get()
    }

    tasks.named('check') {
        dependsOn tasks.named('integrationTest')
    }

    dependencies {
        add('mockitoAgent', "org.mockito:mockito-core:${rootProject.libs.versions.mockito.get()}")
        implementation platform(rootProject.libs.netty.bom)
        testImplementation platform(rootProject.libs.junit.bom)
        testImplementation platform(rootProject.libs.testcontainers.bom)
        testImplementation rootProject.libs.assertj
        testImplementation rootProject.libs.mockito
        testImplementation rootProject.libs.byte.buddy
        testImplementation 'org.junit.jupiter:junit-jupiter'
        integrationTestImplementation platform(rootProject.libs.junit.bom)
        integrationTestImplementation platform(rootProject.libs.testcontainers.bom)
        integrationTestImplementation rootProject.libs.assertj
        integrationTestImplementation rootProject.libs.mockito
        integrationTestImplementation rootProject.libs.byte.buddy
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

subprojects {
    apply plugin: 'maven-publish'

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                artifact javadocJar
                artifact sourcesJar
                groupId = project.group
                artifactId = project.name
                version = project.version

                versionMapping {
                    usage('java-api') {
                        fromResolutionOf('runtimeClasspath')
                    }
                    usage('java-runtime') {
                        fromResolutionResult()
                    }
                }

                pom {
                    packaging = 'jar'
                    name = project.name
                    description.set(project.provider { project.description ?: project.name })
                    url = 'https://github.com/redis-field-engineering/redis-kafka-connect'
                    inceptionYear = '2021'

                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0'
                        }
                    }

                    developers {
                        developer {
                            id = 'jruaux'
                            name = 'Julien Ruaux'
                            email = 'julien@redis.com'
                        }
                    }

                    scm {
                        connection = 'scm:git:git://github.com/redis-field-engineering/redis-kafka-connect.git'
                        developerConnection = 'scm:git:ssh://github.com:redis-field-engineering/redis-kafka-connect.git'
                        url = 'https://github.com/redis-field-engineering/redis-kafka-connect'
                    }
                }
            }
        }

        repositories {
            maven {
                url = rootProject.layout.buildDirectory.dir('staging-deploy')
            }
        }
    }
}
