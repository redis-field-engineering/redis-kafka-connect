import groovy.json.JsonOutput
import java.security.MessageDigest

plugins {
    id 'java-library'
    alias(libs.plugins.shadow)
}

description = 'Redis Kafka Connect'

tasks.withType(Jar).configureEach {
    manifest.attributes(
            'Implementation-Title': project.name,
            'Implementation-Version': project.version.toString())
}

dependencies {
    implementation(libs.lettuce) {
        // Kafka Connect supplies SLF4J. AuthX otherwise brings a private, unbound SLF4J 1.7 copy.
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    implementation libs.jackson
    implementation libs.commons.pool
    compileOnly libs.slf4j
    compileOnly libs.kafka.api
    compileOnly libs.kafka.json
    testImplementation libs.kafka.api
    testImplementation libs.kafka.json
    testImplementation libs.awaitility
    testImplementation libs.mockito
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation libs.slf4j.simple
    testImplementation libs.testcontainers.kafka
    testImplementation libs.testcontainers.junit
    testImplementation libs.testcontainers.redis
    testImplementation libs.testcontainers.redis.enterprise
    integrationTestImplementation libs.lettuce
    integrationTestImplementation libs.jackson
    integrationTestImplementation libs.slf4j
    integrationTestImplementation libs.mockito
    integrationTestImplementation libs.kafka.api
    integrationTestImplementation libs.kafka.json
    integrationTestImplementation libs.testcontainers.kafka
    integrationTestImplementation libs.testcontainers.junit
    integrationTestImplementation libs.testcontainers.redis
    integrationTestImplementation libs.testcontainers.redis.enterprise
    integrationTestImplementation libs.awaitility
    integrationTestRuntimeOnly libs.slf4j.simple
}

testing {
    suites {
        integrationTest {
            sources {
                java {
                    srcDirs = ['src/test/java']
                }
                resources {
                    srcDirs = ['src/test/resources']
                }
            }
        }
    }
}

tasks.named('test') {
    exclude '**/*IntegrationTests.class'
    exclude '**/Abstract*IntegrationTests.class'
    exclude '**/RedisContainerFactory.class'
}

tasks.named('integrationTest') {
    include '**/*IntegrationTests.class'
    exclude '**/ConfluentWorkerIntegrationTests.class'
}

tasks.named('shadowJar') {
    enableAutoRelocation.set(true)
    relocationPrefix.set('com.redis.kafka.connect.shaded')
    mergeServiceFiles()
    filesMatching(['META-INF/services/**', 'META-INF/*.kotlin_module']) {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}

String archiveFilename = 'redis-redis-kafka-connect'
String releaseDate = java.time.format.DateTimeFormatter.ISO_LOCAL_DATE.format(java.time.LocalDateTime.now())

tasks.register('prepareConfluentArchive', Sync) {
    group = "Confluent"
    description = "Prepares the Confluent archive file for Confluent Hub"
    dependsOn tasks.shadowJar
    
    String baseDir = "$archiveFilename-${project.version}"
    from('config/archive/manifest.json') {
        expand(projectVersion: "${project.version}", releaseDate: "${releaseDate}")
    }
    from('config/archive/assets') {
        into 'assets'
    }
    from(layout.buildDirectory.dir('libs')) {
        include "${project.name}-${project.version}-all.jar"
        into 'lib'
    }
    from('../..') {
        include 'README.adoc'
        include 'LICENSE'
        into 'doc'
    }
    from('../../docs/guide/src/docs/asciidoc/migration.adoc') {
        into 'doc'
        rename { 'MIGRATION.adoc' }
    }
    from('../../docs/guide/src/docs/asciidoc/release.adoc') {
        into 'doc'
        rename { 'RELEASE.adoc' }
    }
    into layout.buildDirectory.dir("confluentArchive/${baseDir}")
}

tasks.register('createConfluentArchive', Zip) {
    group = "Confluent"
    description = "Creates the Confluent archive file to be released to Confluent Hub"
    dependsOn tasks.prepareConfluentArchive
    from(layout.buildDirectory.dir("confluentArchive/${archiveFilename}-${project.version}")) {
        into "${archiveFilename}-${project.version}"
    }
    archiveBaseName = ""
    archiveAppendix = archiveFilename
    archiveVersion.set(project.version.toString())
    destinationDirectory = layout.buildDirectory.dir('confluent')
}

tasks.named('build') {
    finalizedBy createConfluentArchive
}

// Keep packaged-worker qualification separate from the task-runtime matrix.
['workerTest', 'workerImageTest'].each { taskName ->
    tasks.register(taskName, Test) {
        description = taskName == 'workerTest'
                ? 'Runs the packaged connector in Confluent Platform on an explicit Java 21 runtime.'
                : 'Runs the packaged connector in the unmodified Confluent Platform image with its bundled Java runtime.'
        group = 'verification'
        testClassesDirs = sourceSets.integrationTest.output.classesDirs
        classpath = sourceSets.integrationTest.runtimeClasspath
        include '**/ConfluentWorkerIntegrationTests.class'
        dependsOn tasks.named('createConfluentArchive')
        shouldRunAfter tasks.named('integrationTest')
        systemProperty 'connector.plugin.archive', tasks.named('createConfluentArchive').flatMap { it.archiveFile }.get().asFile.absolutePath
        if (providers.gradleProperty('previousConnectorArchive').isPresent()) {
            systemProperty 'connector.previous.archive', providers.gradleProperty('previousConnectorArchive').get()
        }
        systemProperty 'connector.plugin.jar', tasks.named('shadowJar').flatMap { it.archiveFile }.get().asFile.absolutePath
        systemProperty 'connector.worker.dockerfile', rootProject.file('config/testing/worker.Dockerfile').absolutePath
        systemProperty 'connector.worker.native', Boolean.toString(taskName == 'workerImageTest')
        systemProperty 'confluent.version', providers.gradleProperty('confluentVersion').orElse('8.3.2').get()
    }
}

tasks.named('workerImageTest') {
    mustRunAfter tasks.named('workerTest')
}

tasks.named('check') {
    dependsOn tasks.named('workerTest'), tasks.named('workerImageTest')
}

// Preserve dependency identities even when shading removes Maven metadata from JARs.
tasks.register('writeRuntimeInventory') {
    group = 'verification'
    def inventory = rootProject.layout.buildDirectory.file('release-audit/runtime-inventory.json')
    dependsOn tasks.named('shadowJar')
    def shadedJar = tasks.named('shadowJar').flatMap { it.archiveFile }
    inputs.files(configurations.runtimeClasspath)
    inputs.file(shadedJar)
    inputs.property('releaseVersion', project.version.toString())
    outputs.file(inventory)
    doLast {
        def dependencies = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.collect { artifact ->
            [group: artifact.moduleVersion.id.group, name: artifact.name,
             version: artifact.moduleVersion.id.version, file: artifact.file.absolutePath]
        }
        inventory.get().asFile.parentFile.mkdirs()
        inventory.get().asFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(
                [version: project.version.toString(),
                 jarSha256: MessageDigest.getInstance('SHA-256').digest(shadedJar.get().asFile.bytes).encodeHex().toString(),
                 dependencies: dependencies]))
    }
}
