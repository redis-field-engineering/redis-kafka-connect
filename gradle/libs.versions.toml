[versions]
# Build plugins
axion-release = "1.21.4"
ben-manes-versions = "0.66.0"
shadow = "9.6.1"

# Runtime and test dependencies
lettuce = "7.9.0.RELEASE"
netty = "4.2.19.Final"
jackson = "2.22.4"
commons-pool = "2.13.1"
slf4j = "2.0.20"
kafka = "4.3.1"
awaitility = "4.3.0"
assertj = "3.27.7"
mockito = "5.24.0"
byte-buddy = "1.18.15"
junit = "6.1.3"
testcontainers-core = "2.0.5"
testcontainers-redis = "3.0.0"

[libraries]
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka", version.ref = "testcontainers-core" }
lettuce = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
jackson = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
commons-pool = { module = "org.apache.commons:commons-pool2", version.ref = "commons-pool" }
slf4j = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
kafka-api = { module = "org.apache.kafka:connect-api", version.ref = "kafka" }
kafka-json = { module = "org.apache.kafka:connect-json", version.ref = "kafka" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
byte-buddy = { module = "net.bytebuddy:byte-buddy", version.ref = "byte-buddy" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers-core" }
testcontainers-redis = { module = "com.redis:testcontainers-redis", version.ref = "testcontainers-redis" }
testcontainers-redis-enterprise = { module = "com.redis:testcontainers-redis-enterprise", version.ref = "testcontainers-redis" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers-core" }

[plugins]
axion-release = { id = "pl.allegro.tech.build.axion-release", version.ref = "axion-release" }
ben-manes-versions = { id = "io.github.ben-manes.versions", version.ref = "ben-manes-versions" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
